<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>zora</title>
  <link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
  <style>
    @font-face { font-family: "Inter"; font-style: normal; font-weight: 100 900; font-display: swap; src: url("/static/fonts/inter.woff2") format("woff2"); }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      display: flex; align-items: center; justify-content: center;
      padding: 2rem 1.25rem;
      background: linear-gradient(180deg, #FFF6EC 0%, #FBF7F1 42%);
      background-attachment: fixed;
      color: #2A2622;
      -webkit-font-smoothing: antialiased;
    }
    .box {
      width: 100%; max-width: 360px;
      background: #FFFFFF;
      border: 1px solid #ECE4D9;
      border-radius: 22px;
      padding: 2.25rem 2rem 2rem;
      box-shadow: 0 12px 40px rgba(190, 120, 80, 0.12);
    }
    .logo { display: flex; align-items: center; gap: 0.6rem; margin-bottom: 1.8rem; }
    .logo img { width: 36px; height: 36px; display: block; }
    .logo-name { font-size: 1.6rem; font-weight: 700; letter-spacing: -0.03em; color: #2A2622; }
    label { display: block; font-size: 0.85rem; font-weight: 600; color: #2A2622; margin-bottom: 0.4rem; }
    input[type="password"] {
      width: 100%; padding: 0.8rem 1rem;
      font-family: inherit; font-size: 1rem;
      border: 1.5px solid #ECE4D9; border-radius: 12px;
      outline: none; background: #FFFFFF; color: #2A2622;
      transition: border-color 0.15s, box-shadow 0.15s;
    }
    input[type="password"]::placeholder { color: #A79E93; }
    input[type="password"]:focus { border-color: #F2683F; box-shadow: 0 0 0 4px rgba(242, 104, 63, 0.15); }
    #btn {
      width: 100%; margin-top: 1rem; padding: 0.85rem 1rem;
      background: #F2683F; color: #2A2622; border: none;
      border-radius: 12px; font-family: inherit;
      font-size: 1rem; font-weight: 700; cursor: pointer;
      transition: transform 0.12s, box-shadow 0.12s;
    }
    #btn:hover:not(:disabled) { transform: translateY(-1px); box-shadow: 0 4px 16px rgba(190, 120, 80, 0.10); }
    #btn:disabled { opacity: 0.5; cursor: not-allowed; }
    #msg { margin-top: 12px; font-size: 0.85rem; min-height: 18px; }
    #msg.error { color: #B23A22; }
    #msg.info  { color: #6B635B; }
  </style>
</head>
<body>
<div class="box">
  <div class="logo">
    <img src="/static/logo.svg" alt="">
    <span class="logo-name">zora</span>
  </div>
  <label for="pw">Password</label>
  <input type="password" id="pw" placeholder="Enter password" autofocus>
  <button id="btn" onclick="login()">Sign in</button>
  <p id="msg"></p>
</div>

<script>
var pw=document.getElementById('pw'), btn=document.getElementById('btn'), msg=document.getElementById('msg');
async function login(){
  if(!pw.value.trim()) return;
  btn.disabled=true; btn.textContent='Signing in…'; msg.textContent=''; msg.className='';
  try {
    var r=await fetch('/login',{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:'password='+encodeURIComponent(pw.value),redirect:'manual'});
    if(r.status===303||r.status===200){
      var loc=r.headers.get('location');
      window.location.href=loc||'/chat';
    } else {
      msg.textContent='Incorrect password'; msg.className='error';
      btn.disabled=false; btn.textContent='Sign in'; pw.focus(); pw.select();
    }
  } catch(e) {
    msg.textContent='Network error'; msg.className='error';
    btn.disabled=false; btn.textContent='Sign in';
  }
}
pw.addEventListener('keydown',function(e){ if(e.key==='Enter') login(); });
</script>
</body>
</html>
